[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Redirección de la raíz según el idioma del navegador (Netlify evalúa de arriba abajo).
# Antigua dirección de Netlify -> dominio propio
[[redirects]]
  from = "https://alc-consulting.netlify.app/*"
  to = "https://alc-consulting.es/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://alc-consulting.netlify.app/*"
  to = "https://alc-consulting.es/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/"
  to = "/fr/"
  status = 302
  force = true
  conditions = { Language = ["fr"] }

[[redirects]]
  from = "/"
  to = "/en/"
  status = 302
  force = true
  conditions = { Language = ["en"] }

[[redirects]]
  from = "/"
  to = "/es/"
  status = 302
  force = true

# Cabeceras de seguridad básicas
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
